# Spool between the codesign runner (github-runner) and sign-pending (signer).
# Entries older than 7 days are cleaned up by systemd-tmpfiles-clean.
d /var/spool/codesign           0755 root          root          -
d /var/spool/codesign/requests  0755 github-runner github-runner 7d
d /var/spool/codesign/results   0755 signer        signer        7d
